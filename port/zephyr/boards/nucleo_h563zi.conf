# Config persistent storage
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_FLASH=y
CONFIG_SOC_FLASH_STM32=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

## Configure for CYW555xx over UART
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_BT_HCI_RAW=y

CONFIG_BT_AIROC_CUSTOM=y
# CYW55573 (CYW55560A1)
#CONFIG_CYW55572=y
#CONFIG_AIROC_CUSTOM_FIRMWARE_HCD_BLOB="CYW55560A1_001.002.087.0415.0000_Generic_UART_37_4MHz_fcbga_iPA_sLNA_ANT0.hcd"
# CYW55513 (CYW55500A1)
#CONFIG_CYW55500=y
CONFIG_AIROC_CUSTOM_FIRMWARE_HCD_BLOB="CYW55500A1_001.002.032.0253.0000_Generic_UART_37_4MHz_wlbga_iPA_sLNA_ANT0.hcd"

CONFIG_AIROC_AUTOBAUD_MODE=y

